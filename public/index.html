<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>AI Voice Agent</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#07080d;color:#e8eaf0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;padding:2rem}
.card{background:#0e1018;border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:2rem;display:flex;flex-direction:column;align-items:center;gap:1.5rem;width:100%;max-width:480px}
.orb{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#4f6ef7,#1a2068);box-shadow:0 0 40px rgba(79,110,247,0.4);display:flex;align-items:center;justify-content:center;transition:all .3s}
.orb.speaking{animation:sp .8s ease-in-out infinite alternate}.orb.listening{background:radial-gradient(circle at 35% 35%,#34d399,#065f46)}
@keyframes sp{to{transform:scale(1.07);box-shadow:0 0 70px rgba(79,110,247,0.7)}}
.wave{display:flex;align-items:center;gap:3px;height:28px}.bar{width:3px;border-radius:2px;background:#4f6ef7;height:4px}
.wave.on .bar{animation:wv var(--d,.8s) ease-in-out infinite alternate}
.bar:nth-child(1){--d:.6s}.bar:nth-child(2){--d:.8s;animation-delay:.05s}.bar:nth-child(3){--d:.5s;animation-delay:.1s}.bar:nth-child(4){--d:.9s;animation-delay:.15s}.bar:nth-child(5){--d:.7s;animation-delay:.2s}.bar:nth-child(6){--d:.6s;animation-delay:.25s}.bar:nth-child(7){--d:.8s;animation-delay:.3s}.bar:nth-child(8){--d:.5s;animation-delay:.35s}.bar:nth-child(9){--d:.9s;animation-delay:.4s}.bar:nth-child(10){--d:.7s;animation-delay:.05s}
@keyframes wv{from{height:4px}to{height:24px}}
h1{font-size:1.2rem;font-weight:700;text-align:center}p{font-size:.82rem;color:#8b90a8;text-align:center}
.status{display:flex;align-items:center;gap:8px;font-size:.75rem;color:#8b90a8;font-family:monospace}
.dot{width:7px;height:7px;border-radius:50%;background:#5a5f72;transition:all .3s}
.dot.on{background:#34d399;box-shadow:0 0 6px rgba(52,211,153,.6)}.dot.talking{background:#7b92ff;animation:bk 1s infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.3}}
.timer{font-size:1.4rem;font-family:monospace;display:none}.timer.on{display:block}
.controls{display:flex;gap:.75rem}
.btn{padding:.75rem 1.75rem;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-start{background:#4f6ef7;color:#fff}.btn-start:hover{background:#7b92ff}
.btn-end{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.btn-mute{background:#141720;color:#8b90a8;border:1px solid rgba(255,255,255,.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.log{width:100%;max-width:480px;background:#0e1018;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:1rem;font-size:.72rem;font-family:monospace;color:#8b90a8;max-height:200px;overflow-y:auto}
.log .ok{color:#34d399}.log .er{color:#f87171}.log .in{color:#7b92ff}
</style></head><body>
<div class="card">
  <div class="orb" id="orb"><svg width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3z"/></svg></div>
  <div class="wave" id="wave"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
  <div><h1>Joshua Ayomide — AI Voice Solutions</h1><p>Click Start to begin a live voice conversation.</p></div>
  <div class="timer" id="timer">00:00</div>
  <div class="status"><div class="dot" id="dot"></div><span id="stxt">Ready</span></div>
  <div class="controls" id="ctrl">
    <button class="btn btn-start" id="startBtn" onclick="startCall()">Start Conversation</button>
  </div>
</div>
<div class="log" id="log"></div>

<script type="module">
import { RetellWebClient } from "https://esm.sh/retell-client-js-sdk@latest";

function log(msg,type="in"){const d=document.getElementById("log");const l=document.createElement("div");l.className=type;l.textContent="> "+msg;d.appendChild(l);d.scrollTop=d.scrollHeight;}

log("SDK loaded via ESM","ok");

let client=null,active=false,muted=false,tiv=null,tsec=0;

function initClient(){
  const c = new RetellWebClient();
  c.on("call_started",()=>{log("Call started!","ok");status("on","Connected");startTimer();});
  c.on("call_ended",()=>{log("Call ended","er");endUI();});
  c.on("agent_start_talking",()=>{log("Agent speaking","ok");status("talking","Agent speaking...");document.getElementById("orb").classList.add("speaking");document.getElementById("wave").classList.add("on");});
  c.on("agent_stop_talking",()=>{log("Agent stopped","in");status("on","Listening...");document.getElementById("orb").classList.remove("speaking");document.getElementById("orb").classList.add("listening");document.getElementById("wave").classList.remove("on");});
  c.on("update",u=>{if(u.transcript)log("Transcript update","ok");});
  c.on("error",e=>{log("SDK error: "+JSON.stringify(e),"er");endUI();});
  return c;
}

window.startCall = async function(){
  log("Fetching access token...");
  document.getElementById("startBtn").disabled=true;
  document.getElementById("startBtn").textContent="Connecting...";
  try{
    const r=await fetch("/create-call",{method:"POST",headers:{"Content-Type":"application/json"}});
    const d=await r.json();
    if(!r.ok)throw new Error(d?.error||"HTTP "+r.status);
    if(!d.access_token)throw new Error("No access token");
    log("Token received","ok");
    client=initClient();
    log("Starting WebRTC call...");
    await client.startCall({accessToken:d.access_token,sampleRate:24000,captureDeviceId:"default",emitRawAudioSamples:false});
    log("startCall resolved","ok");
    active=true;
    document.getElementById("ctrl").innerHTML="<button class='btn btn-mute' id='muteBtn' onclick='window.toggleMute()'>Mute</button><button class='btn btn-end' onclick='window.stopCall()'>End Call</button>";
    document.getElementById("timer").classList.add("on");
  }catch(e){
    log("ERROR: "+e.message,"er");
    document.getElementById("startBtn").disabled=false;
    document.getElementById("startBtn").textContent="Start Conversation";
  }
};

window.stopCall=function(){if(client)client.stopCall();endUI();};
window.toggleMute=function(){if(!client||!active)return;muted=!muted;client.mute(muted);document.getElementById("muteBtn").textContent=muted?"Unmute":"Mute";};

function status(cls,txt){const d=document.getElementById("dot");d.className="dot";if(cls)d.classList.add(cls);document.getElementById("stxt").textContent=txt;}
function endUI(){active=false;muted=false;stopTimer();document.getElementById("orb").className="orb";document.getElementById("wave").classList.remove("on");document.getElementById("timer").classList.remove("on");status("","Ready to connect");document.getElementById("ctrl").innerHTML="<button class='btn btn-start' id='startBtn' onclick='window.startCall()'>Start Conversation</button>";}
function startTimer(){tsec=0;tiv=setInterval(()=>{tsec++;const m=String(Math.floor(tsec/60)).padStart(2,"0");const s=String(tsec%60).padStart(2,"0");document.getElementById("timer").textContent=m+":"+s;},1000);}
function stopTimer(){clearInterval(tiv);tiv=null;tsec=0;document.getElementById("timer").textContent="00:00";}
</script>
</body></html>
